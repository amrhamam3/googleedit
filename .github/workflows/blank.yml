name: Build Amr3D Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Assemble APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find Gradlew and Grant Permissions
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          elif [ -f "./android/gradlew" ]; then
            chmod +x ./android/gradlew
          elif [ -f "./app/gradlew" ]; then
            chmod +x ./app/gradlew
          else
            echo "Searching for gradlew in subdirectories..."
            find . -name "gradlew" -exec chmod +x {} +
          fi

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          elif [ -f "./android/gradlew" ]; then
            cd android && ./gradlew assembleDebug --stacktrace && cd ..
          else
            GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
            if [ -n "$GRADLEW_PATH" ]; then
              DIR=$(dirname "$GRADLEW_PATH")
              echo "Building inside $DIR..."
              cd "$DIR" && ./gradlew assembleDebug --stacktrace
            else
              echo "ERROR: No gradlew or gradle build files found in repository."
              exit 1
            fi
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Amr3D-PreviewPro-Debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/release/*.apk
