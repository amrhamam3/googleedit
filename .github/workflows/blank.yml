name: Build Amr3D Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # يتيح لك بدء البناء يدويًا بضغطة زر في أي وقت

jobs:
  build:
    name: Build & Assemble APK
    runs-on: ubuntu-latest

    steps:
      # 1. جلب الكود المصدري من المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. تجهيز بيئة Java 17 المتوافقة مع Gradle الحديث
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. إعطاء صلاحيات التشغيل لملف gradlew
      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      # 4. بناء الـ APK عبر أمر Gradle
      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 5. رفع ملف الـ APK النهائي ليكون قابلاً للتنزيل مباشرة
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Amr3D-PreviewPro-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
