name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Generate and Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. جلب الكود من المستودع
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. إعداد بيئة Node.js وبناء تطبيق الويب
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Dist
        run: npm run build

      # 3. إعداد بيئة Java 21 (المطلوبة لـ Capacitor 7 و Gradle 8.11)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 4. إعداد بيئة Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. تثبيت Capacitor وبناء بيئة الأندرويد تلقائياً
      - name: Initialize Android Project with Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --save
          npx cap init "Amr3D Preview Pro" "com.amr3d.previewpro" --web-dir "dist"
          npx cap add android
          npx cap sync android

      # 6. إعطاء صلاحيات التشغيل لـ gradlew
      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      # 7. تجميع وبناء ملف الـ APK
      - name: Assemble Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      # 8. رفع ملف الـ APK الناتج للتنزيل الفوري
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Amr3D-PreviewPro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
